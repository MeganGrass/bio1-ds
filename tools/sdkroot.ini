# local Sony PlayStation PSY-Q SDK directory list
#
# SLUS-00747 (Resident Evil Director's Cut, USA) needs several SDK versions:
#       PSY-Q 3.3   (LIBSND, LIBSPU)
#       PSY-Q 3.5   (NONE2.OBJ, the overlay startup)
#       PSY-Q 3.7   (most libraries, 2MBYTE.OBJ)
#       PSY-Q 4.0   (ASPSX 2.56, PSYLINK 2.52, PSYLIB, LIBGS members)
#       PSY-Q 4.2   (LIBAPI, LIBPAD)
#       PSY-Q 4.3   (LIBPAD WAITRC2)
#
# Before compiling, adjust these locations (no spaces in the paths), then run "setup.bat" once to build the
# custom PSY-Q libraries (tools\custom-sdk). This is the only place the SDK locations are written down.
PSYQ_3_3=C:\Framework\sdk\psx\PSY-Q_3_3
PSYQ_3_5=C:\Framework\sdk\psx\PSY-Q_3_5
PSYQ_3_7=C:\Framework\sdk\psx\PSY-Q_3_7
PSYQ_4_0=C:\Framework\sdk\psx\PSY-Q_4_0
PSYQ_4_2=C:\Framework\sdk\psx\PSY-Q_4_2
PSYQ_4_3=C:\Framework\sdk\psx\PSY-Q_4_3

# optional: folder holding the retail files (SLUS_007.47 and PSXUSA\PROG2\*.EXE), read only; when set,
# the build's final check also compares byte by byte (the check against the pinned SHA-256 always runs)
RETAIL_USA=F:\Games\BioHazard\ROM\Sony Playstation 1\Resident Evil\Resident Evil - Director's Cut - Dual Shock [U] [SLUS-00747]
